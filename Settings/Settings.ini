[Rainmeter]
Update=-1
DynamicWindowSize=1
OnRefreshAction=[!DisableMeasure HiddenGames][!UpdateMeasure TabSwitch]

[Variables]
@include=#@#SkinInfo.inc
@include2=#@#GamesInfo.inc
@include3=#@#NonSteamGames.inc
ActiveConf="SteamyRainList.ini"
ActiveConfig="SteamyRainList.ini"
ActiveTab=1
DefaultVisTile=3.#Half#
DefaultGap=0
MaxGap=100
VisTileN=VisibleTiles
VisTile=#VisibleTiles#
YPLUS=([TilePixelsY]+20)
XPLUS=0
OHalfTiles=#Dark1#
OArrow=#Dark1#
OFade=#Dark1#
OHead=#Dark1#
ExtraSlotMax=20
ScanNeeded=0
HasFileChooseFlag=1
; Manual override: set to 1 after confirming plugin loads; Browse meters check this.
; Default 1 when dll is shipped; set to 0 to force InputText-only.
ExtraEditIndex=1
_FoundSlot=0
_PickPath=
_PickIcon=
_PickTarget=
_PickSlot=1
_PickSlotPadded=001
_GameDirsMode=append
; Hidden list (shared HiddenList.inc) — overrides SkinInfo FirstGame for list rows
FirstGame=2
Vis0=0
Egame0Vis=0
HiddenListHidden=1
; Shell layout (520×640 panel)
WinW=520
WinH=640
HeaderH=28
TabBarY=28
TabBarH=32
ContentTop=60
ContentH=580
Pad=16
ContentW=(#WinW#-#Pad#*2)
RowH=28
SectionGap=12
; Extra tab: fixed chrome + inner scroll list
ExtraChromeH=56
ExtraListTop=(#ContentTop#+#ExtraChromeH#)
ExtraListH=(#ContentH#-#ExtraChromeH#)
ExtraOffset=0
ExtraRowH=28
ExtraScrollMax=(Max(0,(20*#ExtraRowH#+16)-#ExtraListH#))
; Hidden tab: Unhide All chrome + list sized to ContentW/H
HiddenChromeH=40
HiddenListW=#ContentW#
HiddenListH=(#ContentH#-#HiddenChromeH#)
HiddenEntrySize=24
EntrySize=#HiddenEntrySize#
HiddenListX=#Pad#
HiddenChromeY=#ContentTop#
HiddenListY=(#ContentTop#+#HiddenChromeH#)
VisibleTilesS=(#HiddenListH#/#EntrySize#)


;_________________________________________________
;____________________MEASURES_____________________
[HasFileChoose]
Measure=Plugin
Plugin=#@#Plugins\FileChoose
; If plugin fails to load, Rainmeter logs error; keep Browse actions gated by HasFileChooseFlag.
Disabled=1

[FileChooseFolder]
Measure=Plugin
Plugin=#@#Plugins\FileChoose
UseNewStyle=1
ReturnValue=Path
Command1=[!SetVariable _PickPath "$Path$"][!UpdateMeasure PathPickSink]
DynamicVariables=1

[FileChooseFile]
Measure=Plugin
Plugin=#@#Plugins\FileChoose
ReturnValue=Path
GetIcon=0
Command1=[!SetVariable _PickPath "$Path$"][!UpdateMeasure FilePickSink]
DynamicVariables=1

[FileChooseImage]
Measure=Plugin
Plugin=#@#Plugins\FileChoose
ReturnValue=Path
GetIcon=1
IconCache=#@#img\EIcon
IconSize=3
Command1=[!SetVariable _PickPath "$Path$"][!SetVariable _PickIcon "$Icon$"][!UpdateMeasure ImagePickSink]
DynamicVariables=1

[PathPickSink]
Measure=Calc
Formula=1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!UpdateMeasure PathPickRouter]

[PathPickRouter]
Measure=String
String=#_PickTarget#
DynamicVariables=1
Disabled=1
IfMatch=(?i)^GameDirs$
IfMatchAction=[!UpdateMeasure PathPickGameDirs]
IfNotMatchAction=[!WriteKeyValue Variables "#_PickTarget#" "#_PickPath#" "#@#SkinInfo.inc"][!SetVariable "#_PickTarget#" "#_PickPath#"][!UpdateMeterGroup TabPaths][!Redraw]

[PathPickGameDirs]
Measure=String
String=#_GameDirsMode#
DynamicVariables=1
Disabled=1
IfMatch=(?i)^append$
IfMatchAction=[!UpdateMeasure PathPickGameDirsAppend]
IfNotMatchAction=[!WriteKeyValue Variables GameDirs "#_PickPath#" "#@#SkinInfo.inc"][!SetVariable GameDirs "#_PickPath#"][!SetVariable _GameDirsMode "append"][!UpdateMeterGroup TabPaths][!Redraw]

[PathPickGameDirsAppend]
Measure=String
String=#GameDirs#
DynamicVariables=1
Disabled=1
IfMatch=.+
IfMatchAction=[!WriteKeyValue Variables GameDirs "#GameDirs#,#_PickPath#" "#@#SkinInfo.inc"][!SetVariable GameDirs "#GameDirs#,#_PickPath#"][!SetVariable _GameDirsMode "append"][!UpdateMeterGroup TabPaths][!Redraw]
IfNotMatchAction=[!WriteKeyValue Variables GameDirs "#_PickPath#" "#@#SkinInfo.inc"][!SetVariable GameDirs "#_PickPath#"][!SetVariable _GameDirsMode "append"][!UpdateMeterGroup TabPaths][!Redraw]

[FilePickSink]
Measure=Calc
Formula=1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!UpdateMeasure FilePickRouter]

[FilePickRouter]
Measure=String
String=#_PickTarget#
DynamicVariables=1
Disabled=1
IfMatch=^Egame\d+Path$
IfMatchAction=[!WriteKeyValue Variables "#_PickTarget#" """#_PickPath#""" "#@#NonSteamGames.inc"][!SetVariable "#_PickTarget#" "#_PickPath#"][!SetVariable ScanNeeded 1][!UpdateMeasure ExtraTabRefresh][!Redraw]
IfNotMatchAction=[!UpdateMeasure PathPickSink]

[ImagePickSink]
Measure=Calc
Formula=1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!SetVariable "EIconPath#_PickSlot#" "#_PickPath#"]["cmd" "/c" "copy /Y \"#_PickPath#\" \"#@#img\EIcon\#_PickSlotPadded#.jpg\""][!SetVariable ScanNeeded 1][!UpdateMeasure ExtraTabRefresh][!Redraw]

[PathsBrowseGate]
Measure=Calc
Formula=#HasFileChooseFlag#
DynamicVariables=1
Disabled=1
OnUpdateAction=[!SetOption SteamPathBrowse Hidden "(1-#HasFileChooseFlag#)"][!SetOption GameDirsBrowse Hidden "(1-#HasFileChooseFlag#)"][!SetOption GameDirsReplace Hidden "(1-#HasFileChooseFlag#)"][!SetOption RainMeterEXEBrowse Hidden "(1-#HasFileChooseFlag#)"][!UpdateMeter SteamPathBrowse][!UpdateMeter GameDirsBrowse][!UpdateMeter GameDirsReplace][!UpdateMeter RainMeterEXEBrowse]

[ExtraBrowseGate]
; Hide Browse/Icon when slot empty OR FileChoose unavailable (Paths-style Hidden formula).
Measure=Calc
Formula=#HasFileChooseFlag#
DynamicVariables=1
Disabled=1
OnUpdateAction=[!SetOption ExtraRow1Browse Hidden "([ExtraHas1]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow2Browse Hidden "([ExtraHas2]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow3Browse Hidden "([ExtraHas3]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow4Browse Hidden "([ExtraHas4]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow5Browse Hidden "([ExtraHas5]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow6Browse Hidden "([ExtraHas6]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow7Browse Hidden "([ExtraHas7]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow8Browse Hidden "([ExtraHas8]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow9Browse Hidden "([ExtraHas9]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow10Browse Hidden "([ExtraHas10]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow11Browse Hidden "([ExtraHas11]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow12Browse Hidden "([ExtraHas12]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow13Browse Hidden "([ExtraHas13]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow14Browse Hidden "([ExtraHas14]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow15Browse Hidden "([ExtraHas15]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow16Browse Hidden "([ExtraHas16]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow17Browse Hidden "([ExtraHas17]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow18Browse Hidden "([ExtraHas18]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow19Browse Hidden "([ExtraHas19]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow20Browse Hidden "([ExtraHas20]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow1Icon Hidden "([ExtraHas1]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow2Icon Hidden "([ExtraHas2]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow3Icon Hidden "([ExtraHas3]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow4Icon Hidden "([ExtraHas4]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow5Icon Hidden "([ExtraHas5]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow6Icon Hidden "([ExtraHas6]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow7Icon Hidden "([ExtraHas7]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow8Icon Hidden "([ExtraHas8]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow9Icon Hidden "([ExtraHas9]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow10Icon Hidden "([ExtraHas10]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow11Icon Hidden "([ExtraHas11]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow12Icon Hidden "([ExtraHas12]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow13Icon Hidden "([ExtraHas13]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow14Icon Hidden "([ExtraHas14]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow15Icon Hidden "([ExtraHas15]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow16Icon Hidden "([ExtraHas16]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow17Icon Hidden "([ExtraHas17]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow18Icon Hidden "([ExtraHas18]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow19Icon Hidden "([ExtraHas19]+(1-#HasFileChooseFlag#))"][!SetOption ExtraRow20Icon Hidden "([ExtraHas20]+(1-#HasFileChooseFlag#))"]

; Find first empty Extra slot (1..ExtraSlotMax), write New Game placeholder
[FindEmptyExtraSlot]
Measure=Loop
StartValue=1
EndValue=#ExtraSlotMax#
Increment=1
LoopCount=1
OnUpdateAction=[!UpdateMeasure FindEmptyExtraSlotCheck]
DynamicVariables=1
Disabled=1

[FindEmptyExtraSlotCheck]
Measure=Calc
; ExtraHasN=1 when name empty (String/RegExp); Calc cannot test string emptiness.
IfCondition=[ExtraHas[&FindEmptyExtraSlot]]=1
IfTrueAction=[!SetVariable _FoundSlot [FindEmptyExtraSlot]][!WriteKeyValue Variables "Egame[FindEmptyExtraSlot]" """New Game""" "#@#NonSteamGames.inc"][!WriteKeyValue Variables "Egame[FindEmptyExtraSlot]Path" "" "#@#NonSteamGames.inc"][!WriteKeyValue Variables "Egame[FindEmptyExtraSlot]Vis" 0 "#@#NonSteamGames.inc"][!SetVariable "Egame[FindEmptyExtraSlot]" "New Game"][!SetVariable "Egame[FindEmptyExtraSlot]Path" ""][!SetVariable "Egame[FindEmptyExtraSlot]Vis" 0][!SetVariable ScanNeeded 1][!CommandMeasure FindEmptyExtraSlot "Reset"][!DisableMeasure FindEmptyExtraSlot][!UpdateMeasure ExtraBumpCount]
IfFalseAction=[!UpdateMeasure FindEmptyExtraSlotContinue]
DynamicVariables=1
IfConditionMode=1
Disabled=1

[FindEmptyExtraSlotContinue]
Measure=Calc
IfCondition=[FindEmptyExtraSlot]<>#ExtraSlotMax#
IfTrueAction=[!UpdateMeasure FindEmptyExtraSlot]
IfFalseAction=[!CommandMeasure FindEmptyExtraSlot "Reset"][!DisableMeasure FindEmptyExtraSlot]
DynamicVariables=1
IfConditionMode=1
Disabled=1

[ExtraBumpCount]
Measure=Calc
IfCondition=#_FoundSlot#>#ExtraGamesCount#
IfTrueAction=[!SetVariable ExtraGamesCount #_FoundSlot#][!WriteKeyValue Variables ExtraGamesCount #_FoundSlot# "#@#NonSteamGames.inc"][!UpdateMeasure ExtraBumpPlus]
IfFalseAction=[!UpdateMeasure ExtraBumpPlus]
DynamicVariables=1
IfConditionMode=1
Disabled=1

[ExtraBumpPlus]
Measure=Calc
Formula=#ExtraGameCountPLUS#+1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!SetVariable ExtraGameCountPLUS [ExtraBumpPlus]][!WriteKeyValue Variables ExtraGameCountPLUS [ExtraBumpPlus] "#@#NonSteamGames.inc"][!UpdateMeasure ExtraTabRefresh][!Redraw]

; Clear slot ExtraEditIndex (no renumber); recount ExtraGamesCount
[ExtraClearSlot]
Measure=Calc
Formula=1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!UpdateMeasure ExtraClearVisAdjust]

[ExtraClearVisAdjust]
Measure=Calc
IfCondition=[#Egame[#ExtraEditIndex]Vis]=0
IfTrueAction=[!SetVariable ExtraGameCountPLUS "(Clamp((#ExtraGameCountPLUS#-1),0,#ExtraSlotMax#))"][!WriteKeyValue Variables ExtraGameCountPLUS "(Clamp((#ExtraGameCountPLUS#-1),0,#ExtraSlotMax#))" "#@#NonSteamGames.inc"][!UpdateMeasure ExtraClearWrite]
IfFalseAction=[!UpdateMeasure ExtraClearWrite]
DynamicVariables=1
IfConditionMode=1
Disabled=1

[ExtraClearWrite]
Measure=Calc
Formula=1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!WriteKeyValue Variables "Egame#ExtraEditIndex#" "" "#@#NonSteamGames.inc"][!WriteKeyValue Variables "Egame#ExtraEditIndex#Path" "" "#@#NonSteamGames.inc"][!WriteKeyValue Variables "Egame#ExtraEditIndex#Vis" 0 "#@#NonSteamGames.inc"][!SetVariable "Egame#ExtraEditIndex#" ""][!SetVariable "Egame#ExtraEditIndex#Path" ""][!SetVariable "Egame#ExtraEditIndex#Vis" 0][!SetVariable ScanNeeded 1][!DisableMeasure ExtraClearSlot][!UpdateMeasureGroup ExtraHas][!EnableMeasure ExtraRecountMax][!CommandMeasure ExtraRecountMax "Reset"][!UpdateMeasure ExtraRecountMax]

[ExtraRecountMax]
Measure=Loop
StartValue=#ExtraSlotMax#
EndValue=1
Increment=-1
LoopCount=1
OnUpdateAction=[!UpdateMeasure ExtraRecountCheck]
DynamicVariables=1
Disabled=1

[ExtraRecountCheck]
Measure=Calc
; ExtraHasN=0 when name occupied (String/RegExp); Calc cannot test string emptiness.
IfCondition=[ExtraHas[&ExtraRecountMax]]=0
IfTrueAction=[!SetVariable ExtraGamesCount [ExtraRecountMax]][!WriteKeyValue Variables ExtraGamesCount [ExtraRecountMax] "#@#NonSteamGames.inc"][!CommandMeasure ExtraRecountMax "Reset"][!DisableMeasure ExtraRecountMax][!UpdateMeasure ExtraTabRefresh][!Redraw]
IfFalseAction=[!UpdateMeasure ExtraRecountContinue]
DynamicVariables=1
IfConditionMode=1
Disabled=1

[ExtraRecountContinue]
Measure=Calc
IfCondition=[ExtraRecountMax]<>1
IfTrueAction=[!UpdateMeasure ExtraRecountMax]
IfFalseAction=[!SetVariable ExtraGamesCount 0][!WriteKeyValue Variables ExtraGamesCount 0 "#@#NonSteamGames.inc"][!CommandMeasure ExtraRecountMax "Reset"][!DisableMeasure ExtraRecountMax][!UpdateMeasure ExtraTabRefresh][!Redraw]
DynamicVariables=1
IfConditionMode=1
Disabled=1

; Toggle EgameNVis for ExtraEditIndex (same PLUS clamp style as Hidden)
[ExtraToggleVis]
Measure=Calc
Formula=1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!UpdateMeasure ExtraToggleVisCheck]

[ExtraToggleVisCheck]
Measure=Calc
IfCondition=[#Egame[#ExtraEditIndex]Vis]=0
IfTrueAction=[!WriteKeyValue Variables "Egame#ExtraEditIndex#Vis" 1 "#@#NonSteamGames.inc"][!WriteKeyValue Variables ExtraGameCountPLUS "(Clamp((#ExtraGameCountPLUS#-1),0,#ExtraGamesCount#))" "#@#NonSteamGames.inc"][!SetVariable ExtraGameCountPLUS "(Clamp((#ExtraGameCountPLUS#-1),0,#ExtraGamesCount#))"][!SetVariable "Egame#ExtraEditIndex#Vis" 1][!SetVariable ScanNeeded 1][!DisableMeasure ExtraToggleVis][!UpdateMeasure ExtraTabRefresh][!Redraw]
IfFalseAction=[!WriteKeyValue Variables "Egame#ExtraEditIndex#Vis" 0 "#@#NonSteamGames.inc"][!WriteKeyValue Variables ExtraGameCountPLUS "(Clamp((#ExtraGameCountPLUS#+1),0,#ExtraGamesCount#))" "#@#NonSteamGames.inc"][!SetVariable ExtraGameCountPLUS "(Clamp((#ExtraGameCountPLUS#+1),0,#ExtraGamesCount#))"][!SetVariable "Egame#ExtraEditIndex#Vis" 0][!SetVariable ScanNeeded 1][!DisableMeasure ExtraToggleVis][!UpdateMeasure ExtraTabRefresh][!Redraw]
DynamicVariables=1
IfConditionMode=1
Disabled=1

; Re-apply per-slot Hidden after ShowMeterGroup (which overwrites Hidden)
[ExtraTabRefresh]
Measure=Calc
Formula=1
DynamicVariables=1
Disabled=1
OnUpdateAction=[!UpdateMeasureGroup ExtraHas][!SetOption ExtraTitle Hidden 0][!SetOption ExtraAddBtn Hidden 0][!SetOption ExtraListContainer Hidden 0][!SetOption ExtraIconHint Hidden 0][!SetOption ExtraListAnchor Hidden 0][!SetOption ExtraScanBanner Hidden "(1-#ScanNeeded#)"][!SetOption ExtraScanBtn Hidden "(1-#ScanNeeded#)"][!SetOptionGroup ExtraRow1 Hidden "[ExtraHas1]"][!SetOptionGroup ExtraRow2 Hidden "[ExtraHas2]"][!SetOptionGroup ExtraRow3 Hidden "[ExtraHas3]"][!SetOptionGroup ExtraRow4 Hidden "[ExtraHas4]"][!SetOptionGroup ExtraRow5 Hidden "[ExtraHas5]"][!SetOptionGroup ExtraRow6 Hidden "[ExtraHas6]"][!SetOptionGroup ExtraRow7 Hidden "[ExtraHas7]"][!SetOptionGroup ExtraRow8 Hidden "[ExtraHas8]"][!SetOptionGroup ExtraRow9 Hidden "[ExtraHas9]"][!SetOptionGroup ExtraRow10 Hidden "[ExtraHas10]"][!SetOptionGroup ExtraRow11 Hidden "[ExtraHas11]"][!SetOptionGroup ExtraRow12 Hidden "[ExtraHas12]"][!SetOptionGroup ExtraRow13 Hidden "[ExtraHas13]"][!SetOptionGroup ExtraRow14 Hidden "[ExtraHas14]"][!SetOptionGroup ExtraRow15 Hidden "[ExtraHas15]"][!SetOptionGroup ExtraRow16 Hidden "[ExtraHas16]"][!SetOptionGroup ExtraRow17 Hidden "[ExtraHas17]"][!SetOptionGroup ExtraRow18 Hidden "[ExtraHas18]"][!SetOptionGroup ExtraRow19 Hidden "[ExtraHas19]"][!SetOptionGroup ExtraRow20 Hidden "[ExtraHas20]"][!UpdateMeasure ExtraBrowseGate][!UpdateMeterGroup TabExtra][!Redraw]

; Path InputText measures live in tabs\TabPaths.inc (X/Y = value col + ContentTop+n*RowH).

[InputExtraNameMeasure]
Measure=Plugin
Plugin=InputText
SolidColor=#InputBG#
FontColor=#TextColor#
FontSize=10
AntiAlias=1
; Absolute X = Pad + container-relative Name X=0; Y set from clicked row meter
X=#Pad#
Y=(#ExtraListTop#+16)
H=15
W=110
DefaultValue=#Egame1#
Command1=[!WriteKeyValue Variables "Egame#ExtraEditIndex#" """$UserInput$""" "#@#NonSteamGames.inc"][!SetVariable "Egame#ExtraEditIndex#" "$UserInput$"][!SetVariable ScanNeeded 1][!UpdateMeasure ExtraTabRefresh][!Redraw]
DynamicVariables=1

[InputExtraPathMeasure]
Measure=Plugin
Plugin=InputText
SolidColor=#InputBG#
FontColor=#TextColor#
FontSize=10
AntiAlias=1
; Absolute X = Pad + container-relative Path X=114; W matches Path field (ends ContentW-120)
X=(#Pad#+114)
Y=(#ExtraListTop#+16)
H=15
W=(#ContentW#-234)
DefaultValue=#Egame1Path#
Command1=[!WriteKeyValue Variables "Egame#ExtraEditIndex#Path" """$UserInput$""" "#@#NonSteamGames.inc"][!SetVariable "Egame#ExtraEditIndex#Path" "$UserInput$"][!SetVariable ScanNeeded 1][!UpdateMeasure ExtraTabRefresh][!Redraw]
DynamicVariables=1

[ModeCheck]
Measure=Calc
IfCondition=#Mode#=0
IfTrueAction=[!SetVariable XPLUS "(#TilePixels#+1)"][!SetVariable VisTile "#VisibleTilesL#"][!SetVariable VisTileN "VisibleTilesL"][!SetVariable DefaultVisTile "2.#Half#"][!SetVariable ActiveConf "SteamyRainList.ini"][!SetVariable ActiveConfig "SteamyRainList.ini"][!SetVariable YPLUS "0"][!UpdatemeterGroup Mode][!EnableMeasure MoveWindow][!UpdateMeasure MoveWindow][!ReDraw]
IfFalseAction=[!SetVariable ActiveConf "SteamyRain.ini"][!SetVariable ActiveConfig "SteamyRain.ini"][!EnableMeasure MoveWindow][!UpdateMeasure MoveWindow][!ReDraw]
IfConditionMode=1
DynamicVariables=1

[MoveWindow]
Measure=Calc
OnUpdateAction=[!Move "(#SkinPosX#+#XPLUS#)" "(#SkinPosY#+#YPLUS#)"]
DynamicVariables=1
Disabled=1

[HiddenCheck]
Measure=Calc
IfCondition=#hiddenWindow#=1
IfTrueAction=[!Refresh "SteamyRain\Hidden" "Hidden.ini"]

[TabSwitch]
Measure=Calc
Formula=#ActiveTab#
IfCondition=#ActiveTab#=1
IfTrueAction=[!DisableMeasure HiddenGames][!SetVariable HiddenListHidden 1][!ShowMeterGroup TabLayout][!HideMeterGroup TabPaths][!HideMeterGroup TabExtra][!HideMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#SettingsHover#"][!SetOption TabBtnPaths FontColor "#TextColor#,180"][!SetOption TabBtnExtra FontColor "#TextColor#,180"][!SetOption TabBtnHidden FontColor "#TextColor#,180"][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabExtra][!UpdateMeterGroup TabHidden][!Redraw]
IfCondition2=#ActiveTab#=2
IfTrueAction2=[!DisableMeasure HiddenGames][!SetVariable HiddenListHidden 1][!HideMeterGroup TabLayout][!ShowMeterGroup TabPaths][!HideMeterGroup TabExtra][!HideMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#TextColor#,180"][!SetOption TabBtnPaths FontColor "#SettingsHover#"][!SetOption TabBtnExtra FontColor "#TextColor#,180"][!SetOption TabBtnHidden FontColor "#TextColor#,180"][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabExtra][!UpdateMeterGroup TabHidden][!UpdateMeasure PathsBrowseGate][!Redraw]
IfCondition3=#ActiveTab#=3
IfTrueAction3=[!DisableMeasure HiddenGames][!SetVariable HiddenListHidden 1][!SetVariable ExtraOffset 0][!HideMeterGroup TabLayout][!HideMeterGroup TabPaths][!ShowMeterGroup TabExtra][!HideMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#TextColor#,180"][!SetOption TabBtnPaths FontColor "#TextColor#,180"][!SetOption TabBtnExtra FontColor "#SettingsHover#"][!SetOption TabBtnHidden FontColor "#TextColor#,180"][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabHidden][!UpdateMeasure ExtraTabRefresh][!Redraw]
IfCondition4=#ActiveTab#=4
IfTrueAction4=[!WriteKeyValue Variables hiddenWindow "0" "#@#SkinInfo.inc"][!SetVariable hiddenWindow 0][!DeactivateConfig "SteamyRain\Hidden" "Hidden.ini"][!SetVariable Offset 0][!SetVariable HiddenListHidden 0][!HideMeterGroup TabLayout][!HideMeterGroup TabPaths][!HideMeterGroup TabExtra][!ShowMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#TextColor#,180"][!SetOption TabBtnPaths FontColor "#TextColor#,180"][!SetOption TabBtnExtra FontColor "#TextColor#,180"][!SetOption TabBtnHidden FontColor "#SettingsHover#"][!EnableMeasure HiddenWindow][!EnableMeasure HideGame][!EnableMeasure HiddenGames][!UpdateMeasure HiddenGames][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabExtra][!UpdateMeterGroup TabHidden][!Redraw]
IfConditionMode=1
DynamicVariables=1
OnUpdateAction=[!EnableMeasure TabSwitch]


;_________________________________________________
;__________________METER STYLES___________________
[NameStyle]
DynamicVariables=1
AntiAlias=1
FontSize=10
FontColor=#TextColor#,180

[ButtonStyle]
SolidColor=#Dark2#,1
FontColor=#TextColor#
FontFace=Segoe Fluent Icons
MouseActionCursor=0
DynamicVariables=1
FontWeight=400
FontSize=12
AntiAlias=1

[ToggleStyle]
MouseOverAction=[!SetOption #CURRENTSECTION# Button "StrokeWidth 2 | Stroke Color #SettingsHover#"][!UpdateMeter #CURRENTSECTION#][!ReDraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Button "StrokeWidth 2 | Stroke Color #Dark2#"][!UpdateMeter #CURRENTSECTION#][!ReDraw]

[OptionStyle]
DynamicVariables=1
AntiAlias=1
FontSize=10
FontColor=#TextColor#
SolidColor=#TextBG#
Padding=5,2,40,1
Y=2R
W=180


;_________________________________________________
;_____________________METERS______________________
[Header]
Meter=Shape
Shape=Rectangle 0,0,#WinW#,#HeaderH#,6 | Fill Color #Dark1# | StrokeWidth 0
Shape2=Rectangle 0,(#HeaderH#/2),#WinW#,(#WinH#-#HeaderH#/2) | Fill Color #Dark1#,#Opacity# | StrokeWidth 0
DynamicVariables=1
Group=Mode

[HeaderClose]
Meter=Shape
Shape=Rectangle (#WinW#-19),0,19,#HeaderH#,6 | Fill Color #CloseBG# | StrokeWidth 0
Shape2=Rectangle (#WinW#-19),(#HeaderH#/2),19,(#HeaderH#/2) | Fill Color #CloseBG# | StrokeWidth 0
Shape3=Rectangle (#WinW#-19),0,11,(#HeaderH#/2) | Fill Color #CloseBG# | StrokeWidth 0
DynamicVariables=1
Hidden=1

[Close]
Meter=String
Text="[\xe8bb]"
FontSize=8
MeterStyle=ButtonStyle
LeftMouseUpAction=[!WriteKeyValue Variables Settings 0 "#@#SkinInfo.inc"][!DeactivateConfig]
MouseOverAction=[!SetOption HeaderClose Hidden 0][!UpdateMeter HeaderClose][!ReDraw]
MouseLeaveAction=[!SetOption HeaderClose Hidden 1][!UpdateMeter HeaderClose][!ReDraw]
Y=8
X=(#WinW#-19)

[Logo]
Meter=Image
PreserveAspectRatio=1
DynamicVariables=1
ImageName=#@#img\SteamyRain
X=#LogoX#
Y=(#LogoY#+1)
H=#LogoSize#

[TabStrip]
Meter=Shape
Shape=Rectangle 0,#TabBarY#,#WinW#,#TabBarH# | Fill Color #TextBG# | StrokeWidth 0
DynamicVariables=1
Group=TabBar

[TabBtnLayout]
Meter=String
Text="Layout"
FontSize=8
FontWeight=600
FontColor=#SettingsHover#
MeterStyle=NameStyle
Group=TabBar
Y=(#TabBarY#+6)
X=#Pad#
LeftMouseUpAction=[!SetVariable ActiveTab 1][!UpdateMeasure TabSwitch]

[TabBtnPaths]
Meter=String
Text="Paths"
FontSize=8
FontWeight=600
FontColor=#TextColor#,180
MeterStyle=NameStyle
Group=TabBar
Y=(#TabBarY#+6)
X=8R
LeftMouseUpAction=[!SetVariable ActiveTab 2][!UpdateMeasure TabSwitch]

[TabBtnExtra]
Meter=String
Text="Extra"
FontSize=8
FontWeight=600
FontColor=#TextColor#,180
MeterStyle=NameStyle
Group=TabBar
Y=(#TabBarY#+6)
X=8R
LeftMouseUpAction=[!SetVariable ActiveTab 3][!UpdateMeasure TabSwitch]

[TabBtnHidden]
Meter=String
Text="Hidden"
FontSize=8
FontWeight=600
FontColor=#TextColor#,180
MeterStyle=NameStyle
Group=TabBar
Y=(#TabBarY#+6)
X=8R
LeftMouseUpAction=[!DeactivateConfig "SteamyRain\Hidden" "Hidden.ini"][!SetVariable ActiveTab 4][!UpdateMeasure TabSwitch]

@include4=#CURRENTPATH#tabs\TabLayout.inc
@include5=#CURRENTPATH#tabs\TabPaths.inc
@include6=#CURRENTPATH#tabs\TabExtra.inc
@include7=#CURRENTPATH#tabs\TabHidden.inc
