[Rainmeter]
Update=-1
DynamicWindowSize=1

[Variables]
@include=#@#SkinInfo.inc
@include2=#@#GamesInfo.inc
@include3=#@#NonSteamGames.inc
ActiveConf="SteamyRainList.ini"
ActiveTab=1
DefaultVisTile=3.#Half#
DefaultGap=0
MaxGap=100
VisTileN=VisibleTiles
VisTile=#VisibleTiles#
YPLUS=([TilePixelsY]+20)
XPLUS=0
OHalfTiles=#Dark1#
OArrow=#Dark1#
OFade=#Dark1#
OHead=#Dark1#
ExtraSlotMax=20
ScanNeeded=0


;_________________________________________________
;____________________MEASURES_____________________
[ModeCheck]
Measure=Calc
IfCondition=#Mode#=0
IfTrueAction=[!SetVariable XPLUS "(#TilePixels#+1)"][!SetVariable VisTile "#VisibleTilesL#"][!SetVariable VisTileN "VisibleTilesL"][!SetVariable DefaultVisTile "2.#Half#"][!SetVariable ActiveConf "SteamyRainList.ini"][!SetVariable YPLUS "0"][!UpdatemeterGroup Mode][!EnableMeasure MoveWindow][!UpdateMeasure MoveWindow][!ReDraw]
IfFalseAction=[!EnableMeasure MoveWindow][!UpdateMeasure MoveWindow][!ReDraw]
IfConditionMode=1
DynamicVariables=1

[MoveWindow]
Measure=Calc
OnUpdateAction=[!Move "(#SkinPosX#+#XPLUS#)" "(#SkinPosY#+#YPLUS#)"]
DynamicVariables=1
Disabled=1

[HiddenCheck]
Measure=Calc
IfCondition=#hiddenWindow#=1
IfTrueAction=[!Refresh "SteamyRain\Hidden" "Hidden.ini"]

[TabSwitch]
Measure=Calc
Formula=#ActiveTab#
IfCondition=#ActiveTab#=1
IfTrueAction=[!ShowMeterGroup TabLayout][!HideMeterGroup TabPaths][!HideMeterGroup TabExtra][!HideMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#SettingsHover#"][!SetOption TabBtnPaths FontColor "#TextColor#,180"][!SetOption TabBtnExtra FontColor "#TextColor#,180"][!SetOption TabBtnHidden FontColor "#TextColor#,180"][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabExtra][!UpdateMeterGroup TabHidden][!Redraw]
IfCondition2=#ActiveTab#=2
IfTrueAction2=[!HideMeterGroup TabLayout][!ShowMeterGroup TabPaths][!HideMeterGroup TabExtra][!HideMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#TextColor#,180"][!SetOption TabBtnPaths FontColor "#SettingsHover#"][!SetOption TabBtnExtra FontColor "#TextColor#,180"][!SetOption TabBtnHidden FontColor "#TextColor#,180"][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabExtra][!UpdateMeterGroup TabHidden][!Redraw]
IfCondition3=#ActiveTab#=3
IfTrueAction3=[!HideMeterGroup TabLayout][!HideMeterGroup TabPaths][!ShowMeterGroup TabExtra][!HideMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#TextColor#,180"][!SetOption TabBtnPaths FontColor "#TextColor#,180"][!SetOption TabBtnExtra FontColor "#SettingsHover#"][!SetOption TabBtnHidden FontColor "#TextColor#,180"][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabExtra][!UpdateMeterGroup TabHidden][!Redraw]
IfCondition4=#ActiveTab#=4
IfTrueAction4=[!HideMeterGroup TabLayout][!HideMeterGroup TabPaths][!HideMeterGroup TabExtra][!ShowMeterGroup TabHidden][!SetOption TabBtnLayout FontColor "#TextColor#,180"][!SetOption TabBtnPaths FontColor "#TextColor#,180"][!SetOption TabBtnExtra FontColor "#TextColor#,180"][!SetOption TabBtnHidden FontColor "#SettingsHover#"][!UpdateMeterGroup TabBar][!UpdateMeterGroup TabLayout][!UpdateMeterGroup TabPaths][!UpdateMeterGroup TabExtra][!UpdateMeterGroup TabHidden][!Redraw]
IfConditionMode=1
DynamicVariables=1
OnUpdateAction=[!EnableMeasure TabSwitch]


;_________________________________________________
;__________________METER STYLES___________________
[NameStyle]
DynamicVariables=1
AntiAlias=1
FontSize=10
FontColor=#TextColor#,180

[ButtonStyle]
SolidColor=#Dark2#,1
FontColor=#TextColor#
FontFace=Segoe Fluent Icons
MouseActionCursor=0
DynamicVariables=1
FontWeight=400
FontSize=12
AntiAlias=1

[ToggleStyle]
MouseOverAction=[!SetOption #CURRENTSECTION# Button "StrokeWidth 2 | Stroke Color #SettingsHover#"][!UpdateMeter #CURRENTSECTION#][!ReDraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Button "StrokeWidth 2 | Stroke Color #Dark2#"][!UpdateMeter #CURRENTSECTION#][!ReDraw]

[OptionStyle]
DynamicVariables=1
AntiAlias=1
FontSize=10
FontColor=#TextColor#
SolidColor=#TextBG#
Padding=5,2,40,1
Y=2R
W=180


;_________________________________________________
;_____________________METERS______________________
[Header]
Meter=Shape
Shape=Rectangle 0,0,270,20,6 | Fill Color #Dark1# | StrokeWidth 0
Shape2=Rectangle 0,10,270,225 | Fill Color #Dark1#,#Opacity# | StrokeWidth 0
DynamicVariables=1
Group=Mode

[HeaderClose]
Meter=Shape
Shape=Rectangle 251,0,19,20,6 | Fill Color #CloseBG# | StrokeWidth 0
Shape2=Rectangle 251,10,19,12 | Fill Color #CloseBG# | StrokeWidth 0
Shape3=Rectangle 251,0,11,12 | Fill Color #CloseBG# | StrokeWidth 0
Hidden=1

[Close]
Meter=String
Text="[\xe8bb]"
FontSize=8
MeterStyle=ButtonStyle
LeftMouseUpAction=[!WriteKeyValue Variables Settings 0 "#@#SkinInfo.inc"][!DeactivateConfig]
MouseOverAction=[!SetOption HeaderClose Hidden 0][!UpdateMeter HeaderClose][!ReDraw]
MouseLeaveAction=[!SetOption HeaderClose Hidden 1][!UpdateMeter HeaderClose][!ReDraw]
Y=6
X=253

[Logo]
Meter=Image
PreserveAspectRatio=1
DynamicVariables=1
ImageName=#@#img\SteamyRain
X=#LogoX#
Y=(#LogoY#+1)
H=#LogoSize#

[TabBtnLayout]
Meter=String
Text="Layout"
FontSize=8
FontWeight=600
FontColor=#SettingsHover#
MeterStyle=NameStyle
Group=TabBar
Y=5
X=25
LeftMouseUpAction=[!SetVariable ActiveTab 1][!UpdateMeasure TabSwitch]

[TabBtnPaths]
Meter=String
Text="Paths"
FontSize=8
FontWeight=600
FontColor=#TextColor#,180
MeterStyle=NameStyle
Group=TabBar
Y=5
X=5R
LeftMouseUpAction=[!SetVariable ActiveTab 2][!UpdateMeasure TabSwitch]

[TabBtnExtra]
Meter=String
Text="Extra"
FontSize=8
FontWeight=600
FontColor=#TextColor#,180
MeterStyle=NameStyle
Group=TabBar
Y=5
X=5R
LeftMouseUpAction=[!SetVariable ActiveTab 3][!UpdateMeasure TabSwitch]

[TabBtnHidden]
Meter=String
Text="Hidden"
FontSize=8
FontWeight=600
FontColor=#TextColor#,180
MeterStyle=NameStyle
Group=TabBar
Y=5
X=5R
LeftMouseUpAction=[!SetVariable ActiveTab 4][!UpdateMeasure TabSwitch]

; Anchor so Layout's first relative meter (TileSize Y=5R) keeps prior vertical offset
[Title]
Meter=String
FontWeight=600
StringCase=upper
FontSize=8
Text="Settings"
MeterStyle=NameStyle
Y=5
X=25
Hidden=1

@include4=#CURRENTPATH#tabs\TabLayout.inc
@include5=#CURRENTPATH#tabs\TabPaths.inc
@include6=#CURRENTPATH#tabs\TabExtra.inc
@include7=#CURRENTPATH#tabs\TabHidden.inc
